<!DOCTYPE html>
<html>
<head>
    <title>RISKFORGE VANTAGE</title>
</head>

<body>

    <h1>RISKFORGE VANTAGE</h1>

    <h2>Network Scanner</h2>

    <form action="/scan" method="POST">

        <label for="target_ip">Target IP:</label>

        <input
            type="text"
            id="target_ip"
            name="target_ip"
            placeholder="192.168.56.103"
            required
        >

        <button type="submit">Run Scan</button>

    </form>

</body>
</html>
